# Retrieval pipeline configuration

dense:
  model: sentence-transformers/all-MiniLM-L6-v2
    top_k: 20
      score_threshold: 0.0

      sparse:
        top_k: 20
          bm25_k1: 1.5
            bm25_b: 0.75

            hybrid:
              rrf_k: 60
                dense_weight: 0.6
                  sparse_weight: 0.4
                    top_k: 10

                    reranker:
                      model: cross-encoder/ms-marco-MiniLM-L-6-v2
                        top_k: 5
                          batch_size: 32
